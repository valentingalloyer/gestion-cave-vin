@if (authService.isLoggedIn()) {
  <div class="user-bar">
    <span>👤 {{ authService.username() }}</span>
    <button type="button" (click)="authService.logout()">Se déconnecter</button>
  </div>
  <app-vin-list #liste
                (ajouterBouteille)="formulaire.ouvrirAjout()"
                (modifierVin)="formulaire.modifier($event)"
                (preparerNouveauMillesime)="formulaire.remplirDepuisExistant($event)"></app-vin-list>
  <app-vin-form #formulaire (caveModifiee)="liste.chargerVins()"></app-vin-form>
} @else {
  <app-login></app-login>
}

@if (toastService.message(); as message) {
  <div class="toast" role="status" (click)="toastService.fermer()">{{ message }}</div>
}
