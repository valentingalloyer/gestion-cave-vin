spring.application.name=GestionCave

# Base de donnees
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 3. Hibernate et Dialecte
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pilote PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions : aucune connexion gardee ouverte sans raison,
# sinon Neon (offre gratuite, 100 h de calcul/mois) ne se met jamais en veille
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

# Logs console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Authentification JWT (secret d'au moins 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-jours=30

# Compte du proprietaire de la cave, cree au demarrage s'il n'existe pas (pas d'inscription publique)
# Le mot de passe n'est utile qu'a la creation du compte
app.proprietaire.username=${PROPRIETAIRE_USERNAME:}
app.proprietaire.password=${PROPRIETAIRE_PASSWORD:}
