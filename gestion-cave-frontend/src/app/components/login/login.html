<div class="login-page">
  <div class="login-card">
    <h1 class="titre-serif">La cave à Jack</h1>
    <h2>Connexion</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" formControlName="username" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password">
      </div>

      @if (erreur()) {
        <p class="erreur" role="alert">{{ erreur() }}</p>
      }

      @if (isTakingLonger()) {
        <div class="wake-up-msg" role="status">
          <p><strong>Le serveur se réveille…</strong></p>
          <p>Ça peut prendre jusqu'à une minute et demie après une longue inactivité.</p>
          <progress></progress>
        </div>
      }

      <button type="submit" class="btn-principal" [disabled]="loginForm.invalid || isLoading()">Se connecter</button>
    </form>
  </div>
</div>
