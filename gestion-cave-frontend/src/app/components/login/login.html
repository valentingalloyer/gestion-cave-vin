<div class="login-page">
  <div class="login-card">
    <h1>La cave à Jack 🍷</h1>
    <h3>Connexion</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" formControlName="username" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password">
      </div>

      @if (erreur()) {
        <p class="erreur">{{ erreur() }}</p>
      }

      @if (isTakingLonger()) {
        <div class="wake-up-msg">
          <p>🍷 <strong>Le serveur se réveille...</strong></p>
          <p>Réveil en cours (jusqu'à 1min30 après inactivité).</p>
          <progress></progress>
        </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || isLoading()">Se connecter</button>
    </form>
  </div>
</div>
