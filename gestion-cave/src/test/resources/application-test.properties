# Configuration des tests : base H2 en mémoire, recréée à chaque lancement
spring.datasource.url=jdbc:h2:mem:cave;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# "date" est un mot réservé pour H2 (colonne de la table degustations)
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.show-sql=false

app.jwt.secret=un-secret-de-test-suffisamment-long-1234
# Pas de compte propriétaire créé au démarrage : chaque test crée ses utilisateurs
app.proprietaire.username=
