# Render (offre gratuite) endort le serveur après 15 minutes sans requête,
# et le réveil prend environ une minute. On l'appelle toutes les 5 minutes
# pendant les heures où Jack utilise l'appli (de 10 h à 1 h du matin).
#
# Budget : ~16 h/jour x 31 jours = ~500 h/mois, sous les 750 h gratuites de Render
# (partagées entre tous les services gratuits du compte Render).
# La nuit, le serveur s'endort : le front affiche alors la dernière cave connue
# pendant le réveil.
#
# GitHub peut retarder les tâches planifiées de quelques minutes : la marge est
# de 15 minutes, d'où un appel toutes les 5 minutes.

name: Garder le serveur éveillé

on:
  schedule:
    # Heures en UTC, sans changement d'heure : 8h00-23h55 UTC.
    # Le serveur reste éveillé ~15 min après le dernier appel, soit à Paris :
    #   - en été (UTC+2)  : de 10h00 à 2h10
    #   - en hiver (UTC+1) : de 9h00 à 1h10
    - cron: '*/5 8-23 * * *'
  # Permet aussi de le lancer à la main depuis l'onglet Actions
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler /api/ping
        # Ne fait pas échouer le workflow : un raté ponctuel ne mérite pas un e-mail
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 https://gestion-cave-vin.onrender.com/api/ping || true)
          echo "Réponse du serveur : ${code:-aucune}"
