<header class="barre-haut">
  <div class="theme-choix" role="radiogroup" aria-label="Thème">
    @for (t of themes; track t.valeur) {
      <button type="button" role="radio"
              [attr.aria-checked]="themeService.theme() === t.valeur"
              [class.actif]="themeService.theme() === t.valeur"
              [attr.aria-label]="t.libelle" [title]="t.libelle"
              (click)="themeService.choisir(t.valeur)">
        @switch (t.valeur) {
          @case ('clair') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          }
          @case ('auto') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" class="plein"/></svg>
          }
          @case ('sombre') {
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          }
        }
      </button>
    }
  </div>

  @if (authService.isLoggedIn()) {
    <nav class="onglets" aria-label="Navigation">
      <button type="button" [class.actif]="vue() === 'cave'" [attr.aria-current]="vue() === 'cave' ? 'page' : null"
              (click)="vue.set('cave')">Ma cave</button>
      <button type="button" [class.actif]="vue() === 'journal'" [attr.aria-current]="vue() === 'journal' ? 'page' : null"
              (click)="vue.set('journal')">Journal</button>
    </nav>

    <div class="utilisateur">
      <span>{{ authService.username() }}</span>
      <button type="button" class="btn-secondaire" (click)="motDePasseOuvert.set(true)">Mot de passe</button>
      <button type="button" class="btn-secondaire" (click)="authService.logout()">Se déconnecter</button>
    </div>
  }
</header>

@if (authService.isLoggedIn()) {
  @if (vue() === 'journal') {
    <app-journal></app-journal>
  } @else {
    <app-vin-list #liste
                  (ajouterBouteille)="formulaire.ouvrirAjout()"
                  (modifierVin)="formulaire.modifier($event)"></app-vin-list>
    <app-vin-form #formulaire [vins]="liste.vins()" (caveModifiee)="liste.chargerVins()"></app-vin-form>
  }
  @if (motDePasseOuvert()) {
    <app-mot-de-passe (fermer)="motDePasseOuvert.set(false)"></app-mot-de-passe>
  }
} @else {
  <app-login></app-login>
}

@if (toastService.message(); as message) {
  <div class="toast" [class.erreur]="toastService.type() === 'erreur'"
       [attr.role]="toastService.type() === 'erreur' ? 'alert' : 'status'"
       (click)="toastService.fermer()">{{ message }}</div>
}
